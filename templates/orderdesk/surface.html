<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OrderDesk</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#272923;font-family:system-ui,sans-serif;font-size:14px}main{max-width:1040px;margin:auto;padding:42px 46px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}h1{font-size:25px;font-weight:600;letter-spacing:-.7px;margin:0}header span{color:#8b8e84;font-size:12px}.product{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;margin-bottom:46px}.product-art{background:#f4f3ed;border-radius:8px;min-height:228px;display:grid;place-items:center}.keyboard{width:235px;border:7px solid #d7d6cd;background:#deded5;border-radius:9px;box-shadow:0 10px 0 #c9c9be,0 20px 30px #dddcd2;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:7px;transform:rotate(-5deg)}.key{height:18px;border-radius:3px;background:#faf9f3;box-shadow:0 2px 0 #c5c5ba}.key:nth-child(10),.key:first-child{background:#db7047}.key:last-child{grid-column:span 5}.product small{color:#888b7c;font-size:11px}.product h2{font-size:25px;margin:10px 0 24px;font-weight:550;letter-spacing:-.6px}.stock{display:flex;align-items:baseline;gap:8px;color:#737969;margin-bottom:24px}.stock strong{font-size:32px;font-weight:500;color:#30372a}.controls{display:flex;gap:10px;align-items:center}button,input{font:inherit}button{background:#41493a;border:0;color:#fff;border-radius:6px;padding:12px 23px;cursor:pointer;font-weight:500}button:disabled{opacity:.5;cursor:wait}input{width:62px;border:1px solid #dfe2d5;border-radius:6px;padding:11px;text-align:center}label{font-size:11px;color:#7d8571;display:block;margin-bottom:8px}.orders-heading{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8e9e1;padding-bottom:15px}.orders-heading h2{font-size:17px;font-weight:550;margin:0}.orders-heading span{color:#8b917e;font-size:12px}.empty{padding:50px 0;color:#8c9281;text-align:center;font-size:13px}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{color:#8b9180;font-size:10px;font-weight:500;padding:15px 10px}td{padding:17px 10px;border-top:1px solid #eff0e9}td:first-child{font-family:monospace;color:#8b9180}#notice{min-height:32px;font-size:12px;color:#596d43;margin-top:14px}#notice.error{color:#b44c3c}#offline{padding:24px;background:#fff4ef;color:#a34f37;margin-bottom:24px;border-radius:6px}button.secondary{background:white;color:#606b50;border:1px solid #dce0d2;padding:8px 14px}button:focus-visible,input:focus-visible{outline:2px solid #c95728;outline-offset:3px}@media(max-width:650px){main{padding:25px 21px}header{margin-bottom:25px}.product{gap:24px;grid-template-columns:1fr;margin-bottom:20px}.product-art{min-height:170px}.keyboard{transform:rotate(-4deg) scale(.8)}.product h2{font-size:22px;margin:7px 0 15px}.stock{margin-bottom:16px}td,th{padding:13px 6px}th:last-child,td:last-child{display:none}}
</style></head><body><main>
<header><h1>Pedidos</h1><span>OrderDesk</span></header>
<div id="offline" hidden role="alert"></div>
<section class="product"><div class="product-art" aria-hidden="true"><div class="keyboard" id="keyboard"></div></div><div><small>CATÁLOGO / 001</small><h2 id="product-name">Carregando produto…</h2><div class="stock"><strong id="stock">—</strong><span>unidades disponíveis</span></div><label for="quantity">Quantidade</label><div class="controls"><input id="quantity" type="number" min="1" max="100" value="1"><button id="create" disabled>Criar pedido</button></div><div id="notice" role="status" aria-live="polite"></div></div></section>
<section><div class="orders-heading"><h2>Pedidos</h2><span id="count">—</span><button class="secondary" id="refresh">Atualizar</button></div><div id="empty" class="empty">Nenhum pedido ainda.</div><table id="orders" hidden><thead><tr><th>Pedido</th><th>Produto</th><th>Quantidade</th><th>Criado em</th></tr></thead><tbody id="rows"></tbody></table></section>
</main><script>
// A surface pertence ao sistema. O host apenas transporta operações HTTP permitidas.
const pending = new Map(); let sequence = 0; let product;
function request(method, path, body) {
  const id = String(++sequence);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { pending.delete(id); reject(new Error('O sistema não respondeu.')); }, 10000);
    pending.set(id, { resolve, reject, timer });
    parent.postMessage({ type: 'bunkerlab:request', id, method, path, body }, '*');
  });
}
window.addEventListener('message', (event) => {
  if (event.source !== parent || event.data?.type !== 'bunkerlab:response') return;
  const item = pending.get(event.data.id); if (!item) return;
  clearTimeout(item.timer); pending.delete(event.data.id);
  if (event.data.error) item.reject(new Error(event.data.error)); else item.resolve(event.data.response);
});
for(let i=0;i<36;i++){const key=document.createElement('span');key.className='key';document.getElementById('keyboard').append(key);}
const button = document.getElementById('create');
const notice = document.getElementById('notice');
async function refresh() {
  const response = await request('GET', '/state');
  if (response.status !== 200) throw new Error('Não foi possível consultar os pedidos (HTTP ' + response.status + ').');
  const state = response.body; product = state.product;
  document.getElementById('product-name').textContent = product.name;
  document.getElementById('stock').textContent = product.stock;
  document.getElementById('count').textContent = state.orders.length + ' pedidos';
  const rows = document.getElementById('rows'); rows.replaceChildren();
  state.orders.forEach((order, index) => {
    const row = document.createElement('tr');
    ['#' + String(index + 1).padStart(3, '0'), product.name, order.quantity, new Date(order.createdAt).toLocaleTimeString('pt-BR')].forEach(value => { const cell = document.createElement('td'); cell.textContent = value; row.append(cell); });
    rows.append(row);
  });
  document.getElementById('empty').hidden = state.orders.length > 0;
  document.getElementById('orders').hidden = state.orders.length === 0;
  document.getElementById('offline').hidden = true;
}
function unavailable(error) { const element = document.getElementById('offline'); element.textContent = error.message; element.hidden = false; }
button.addEventListener('click', async () => {
  button.disabled = true; notice.textContent = ''; notice.className = '';
  try {
    const quantity = Number(document.getElementById('quantity').value);
    const response = await request('POST', '/orders', { productId: product.id, quantity });
    if (response.status === 201) notice.textContent = 'Pedido criado.';
    else { notice.className = 'error'; notice.textContent = response.status === 409 ? 'Pedido recusado: estoque insuficiente.' : 'Pedido não criado (HTTP ' + response.status + '): ' + (response.body?.error ?? 'Erro no sistema'); }
    await refresh();
  } catch(error) { unavailable(error); } finally { button.disabled = false; }
});
document.getElementById('refresh').addEventListener('click', async () => { try { await refresh(); } catch(error) { unavailable(error); } });
refresh().then(() => { button.disabled = false; }).catch(unavailable);
</script></body></html>
